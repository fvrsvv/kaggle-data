  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - data-minio:/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    networks:
      - airflow-net

  minio-buckets:
    image: quay.io/minio/mc:latest
    container_name: minio-buckets
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 10s;
      /usr/bin/mc alias set dockerminio http://minio:9000  "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}";
      /usr/bin/mc mb dockerminio/"${MINIO_BUCKET_RAW}";
      /usr/bin/mc mb dockerminio/"${MINIO_BUCKET_SILVER}";
      /usr/bin/mc mb dockerminio/"${MINIO_BUCKET_GOLD}";
      exit 0;
      "
    networks:
      - airflow-net

networks:
  airflow-net:
    driver: bridge

volumes:
    data-minio: